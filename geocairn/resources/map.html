<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Géo Cairn — Carte</title>
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <script src="leaflet/leaflet.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { height: 100%; width: 100%; background: #f2efe9; }
        .leaflet-container { font-family: "Segoe UI", Arial, sans-serif; }
        #status {
            position: absolute; bottom: 8px; left: 8px; z-index: 1000;
            background: rgba(255, 255, 255, 0.85); border-radius: 4px;
            padding: 3px 8px; font: 12px "Segoe UI", Arial, sans-serif;
            color: #333; pointer-events: none;
        }
        /* Flèches de sens de parcours. */
        .geocairn-fleche div {
            font-size: 15px; line-height: 16px; text-align: center;
            text-shadow: 0 0 2px #ffffff, 0 0 2px #ffffff;
        }
        /* Mode édition : le curseur indique que le clic pose un point. */
        .leaflet-container.mode-edition { cursor: crosshair; }
        .leaflet-container.mode-edition .leaflet-interactive { cursor: crosshair; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">Chargement de la carte…</div>

    <script>
    "use strict";

    // --- Couches cartographiques -------------------------------------------
    var IGN_BASE = "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0"
        + "&REQUEST=GetTile&STYLE=normal&TILEMATRIXSET=PM"
        + "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";

    var layers = {
        "Plan (OpenStreetMap)": L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            { maxZoom: 19, attribution: "© OpenStreetMap" }),

        "Aérienne / Satellite": L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 19, attribution: "© Esri, Maxar, Earthstar Geographics" }),

        "IGN Plan": L.tileLayer(
            IGN_BASE + "&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&FORMAT=image/png",
            { maxZoom: 19, attribution: "© IGN - Géoplateforme" }),

        // Carte topographique IGN librement diffusée. Le SCAN 25 (1:25000)
        // n'est plus accessible sans licence payante sur la Géoplateforme.
        "IGN Carte topographique": L.tileLayer(
            IGN_BASE + "&LAYER=GEOGRAPHICALGRIDSYSTEMS.MAPS.BDUNI.J1&FORMAT=image/png",
            { maxZoom: 18, attribution: "© IGN - Géoplateforme" }),

        "Photos aériennes IGN": L.tileLayer(
            IGN_BASE + "&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&FORMAT=image/jpeg",
            { maxZoom: 19, attribution: "© IGN - Géoplateforme" })
    };

    var map = L.map("map", {
        center: [48.9315, 1.4402],   // Vallée de la Seine, zone des GPX d'exemple
        zoom: 13,
        zoomControl: true,
        // Rendu sur canvas : les traces réelles atteignent plusieurs milliers
        // de points, ce que le rendu SVG encaisse mal.
        preferCanvas: true,
        layers: [layers["Plan (OpenStreetMap)"]]
    });

    L.control.layers(layers, {}, { position: "topright" }).addTo(map);
    L.control.scale({ imperial: false, position: "bottomright" }).addTo(map);

    // --- Pont Python <-> JavaScript ----------------------------------------
    var bridge = null;

    function formatCoord(latlng) {
        return latlng.lat.toFixed(5) + " ; " + latlng.lng.toFixed(5);
    }

    function setStatus(text) {
        document.getElementById("status").textContent = text;
    }

    function reportView() {
        var c = map.getCenter();
        if (bridge) { bridge.js_view_changed(c.lat, c.lng, map.getZoom()); }
    }

    map.on("mousemove", function (e) {
        setStatus(formatCoord(e.latlng) + "  |  zoom " + map.getZoom());
    });

    map.on("click", function (e) {
        // Le clic qui suit immédiatement un glissement de point, une insertion
        // ou un clic droit ne doit pas poser un point supplémentaire.
        if (gesteRecent()) { return; }
        if (bridge) { bridge.js_map_click(e.latlng.lat, e.latlng.lng); }
    });

    map.on("moveend zoomend", reportView);

    map.on("baselayerchange", function (e) {
        if (bridge) { bridge.js_layer_changed(e.name); }
    });

    // Ctrl+Z depuis la carte : le QWebEngineView capte le clavier, la fenêtre
    // Qt ne verrait pas le raccourci sans ce relais.
    document.addEventListener("keydown", function (e) {
        if (e.ctrlKey && (e.key === "z" || e.key === "Z")) {
            e.preventDefault();
            if (bridge) { bridge.js_undo_request(); }
        }
    });

    // --- Trace en cours de saisie (brouillon) ------------------------------
    var draft = {
        latlngs: [],
        line: L.polyline([], {
            color: "#e6194b", weight: 4, opacity: 0.9
        }),
        vertices: L.layerGroup(),
        markers: [],        // repère par indice, pour éviter les redessins complets
        editing: false
    };
    draft.line.addTo(map);
    draft.vertices.addTo(map);

    var selectedIndex = -1;
    var selectedSet = {};   // indices mis en évidence (sélection multiple)

    function vertexStyle(index) {
        if (index === selectedIndex || selectedSet[index]) {
            return {
                radius: 8, color: "#b8860b", fillColor: "#ffd700",
                fillOpacity: 1, weight: 3
            };
        }
        var isStart = index === 0;
        return {
            radius: isStart ? 6 : 4,
            color: isStart ? "#1f8a3b" : "#e6194b",
            fillColor: isStart ? "#2ecc71" : "#ffffff",
            fillOpacity: 1,
            weight: 2
        };
    }

    function addVertex(latlng, index) {
        var marker = L.circleMarker(latlng, vertexStyle(index));
        marker.geocairnIndex = index;
        draft.markers[index] = marker;
        marker.on("mousedown", function (e) {
            if (!draft.editing) { return; }
            dragged = {
                marker: marker,
                index: marker.geocairnIndex,
                start: draft.latlngs[marker.geocairnIndex]
            };
            map.dragging.disable();
            L.DomEvent.stop(e);
        });
        marker.on("contextmenu", function (e) {
            L.DomEvent.stop(e);
            noterGeste();   // le clic droit ne doit rien ajouter
            if (!bridge) { return; }
            var point = e.containerPoint || map.latLngToContainerPoint(e.latlng);
            bridge.js_point_context(
                marker.geocairnIndex, Math.round(point.x), Math.round(point.y)
            );
        });
        marker.addTo(draft.vertices);
        return marker;
    }

    function redrawVertices() {
        draft.vertices.clearLayers();
        draft.markers = [];
        for (var i = 0; i < draft.latlngs.length; i++) {
            addVertex(draft.latlngs[i], i);
        }
    }

    // --- Clic sur un segment : insertion d'un point ------------------------
    // Leaflet ne dit pas quel segment a été touché : on cherche le plus proche
    // du point cliqué, en coordonnées écran.
    function closestSegment(latlng) {
        var cible = map.latLngToLayerPoint(latlng);
        var meilleur = -1;
        var distanceMin = Infinity;
        for (var i = 0; i < draft.latlngs.length - 1; i++) {
            var a = map.latLngToLayerPoint(draft.latlngs[i]);
            var b = map.latLngToLayerPoint(draft.latlngs[i + 1]);
            var d = L.LineUtil.pointToSegmentDistance(cible, a, b);
            if (d < distanceMin) { distanceMin = d; meilleur = i; }
        }
        return meilleur;
    }

    draft.line.on("click", function (e) {
        if (!draft.editing || draft.latlngs.length < 2) { return; }
        L.DomEvent.stop(e);
        // Le rendu canvas relaie aussi le clic à la carte : sans cette marque,
        // un point serait ajouté à la fin en plus de l'insertion.
        noterGeste();
        var segment = closestSegment(e.latlng);
        if (segment >= 0 && bridge) {
            bridge.js_point_inserted(segment + 1, e.latlng.lat, e.latlng.lng);
        }
    });

    // --- Déplacement d'un point à la souris --------------------------------
    // L.circleMarker n'est pas déplaçable nativement ; on gère le glissement
    // à la main plutôt que d'ajouter un L.marker par point, ce qui serait
    // lourd sur les traces de plusieurs milliers de points.
    var dragged = null;

    // Certains gestes (glisser un point, insérer sur un segment, clic droit)
    // déclenchent ensuite un clic sur la carte qu'il faut ignorer. Un simple
    // drapeau restait allumé quand ce clic ne venait jamais — après un clic
    // droit, par exemple — et avalait alors le clic suivant, pourtant
    // légitime. On retient donc l'instant du geste, et on n'ignore que ce qui
    // le suit immédiatement.
    var dernierGeste = 0;
    var DELAI_GESTE_MS = 400;

    function noterGeste() { dernierGeste = Date.now(); }

    function gesteRecent() {
        if (!dernierGeste) { return false; }
        var recent = (Date.now() - dernierGeste) < DELAI_GESTE_MS;
        dernierGeste = 0;
        return recent;
    }

    map.on("mousemove", function (e) {
        if (!dragged) { return; }
        dragged.marker.setLatLng(e.latlng);
        draft.latlngs[dragged.index] = [e.latlng.lat, e.latlng.lng];
        draft.line.setLatLngs(draft.latlngs);
    });

    map.on("mouseup", function (e) {
        if (!dragged) { return; }
        var index = dragged.index;
        var start = dragged.start;
        dragged = null;
        map.dragging.enable();
        // Dans les deux cas, le clic qui suit ne doit pas poser un point.
        noterGeste();

        var immobile = start
            && e.latlng.lat === start[0] && e.latlng.lng === start[1];
        if (!bridge) { return; }
        if (immobile) {
            bridge.js_point_selected(index);   // simple clic : sélection
        } else {
            bridge.js_point_moved(index, e.latlng.lat, e.latlng.lng);
        }
    });

    // --- Traces enregistrées affichées sur la carte ------------------------
    // Plusieurs traces peuvent être visibles simultanément ; chacune a sa
    // polyligne, ses repères de départ/arrivée, sa couleur et son opacité.
    var shownTracks = {};   // identifiant -> { line, ends, arrows }
    var focusGroup = L.layerGroup();   // points désignés sur une trace consultée
    focusGroup.addTo(map);

    function endStyle(couleur, remplissage, opacity) {
        return {
            radius: 7, color: couleur, fillColor: remplissage,
            fillOpacity: opacity, opacity: opacity, weight: 2
        };
    }

    // Flèches indiquant le sens de parcours. Le nombre reste modeste : elles
    // sont recalculées à chaque zoom pour rester correctement orientées.
    var NB_FLECHES = 8;

    function arrowIcon(angle, couleur) {
        return L.divIcon({
            className: "geocairn-fleche",
            iconSize: [16, 16],
            iconAnchor: [8, 8],
            html: '<div style="transform: rotate(' + angle + 'deg);'
                + ' color:' + couleur + ';">▲</div>'
        });
    }

    function drawArrows(trace, couleur, opacity) {
        trace.arrows.clearLayers();
        var points = trace.line.getLatLngs();
        if (points.length < 2) { return; }

        var pas = Math.max(1, Math.floor(points.length / (NB_FLECHES + 1)));
        for (var i = pas; i < points.length; i += pas) {
            var a = map.latLngToLayerPoint(points[i - 1]);
            var b = map.latLngToLayerPoint(points[i]);
            if (a.x === b.x && a.y === b.y) { continue; }
            // Le triangle pointe vers le haut : 0° correspond au nord écran.
            var angle = Math.atan2(b.x - a.x, a.y - b.y) * 180 / Math.PI;
            var marqueur = L.marker(points[i], {
                icon: arrowIcon(angle.toFixed(1), couleur),
                interactive: false,
                opacity: opacity
            });
            marqueur.addTo(trace.arrows);
        }
    }

    function redrawAllArrows() {
        Object.keys(shownTracks).forEach(function (id) {
            var trace = shownTracks[id];
            drawArrows(trace, trace.couleur, trace.opacity);
        });
    }

    map.on("zoomend", redrawAllArrows);

    function boundsOf(ids) {
        var bounds = L.latLngBounds([]);
        (ids || []).forEach(function (id) {
            var trace = shownTracks[id];
            if (trace) { bounds.extend(trace.line.getBounds()); }
        });
        return bounds;
    }

    // --- API appelée depuis Python -----------------------------------------
    window.geocairn = {
        setView: function (lat, lon, zoom) {
            map.setView([lat, lon], zoom === undefined ? map.getZoom() : zoom);
        },
        fitBounds: function (bounds) {
            if (bounds && bounds.length === 2) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }
        },
        setBaseLayer: function (name) {
            if (!layers[name]) { return false; }
            for (var key in layers) {
                if (map.hasLayer(layers[key]) && key !== name) {
                    map.removeLayer(layers[key]);
                }
            }
            map.addLayer(layers[name]);
            return true;
        },
        layerNames: function () { return Object.keys(layers); },
        isReady: function () { return true; },

        // À appeler après un changement de taille du conteneur : sans cela
        // Leaflet garde une taille périmée, et fitBounds ne recadre rien.
        invalidateSize: function () {
            map.invalidateSize();
            return [map.getSize().x, map.getSize().y];
        },

        mapSize: function () { return [map.getSize().x, map.getSize().y]; },

        // -- brouillon ------------------------------------------------------
        setEditMode: function (on) {
            draft.editing = !!on;
            var container = map.getContainer();
            if (draft.editing) {
                L.DomUtil.addClass(container, "mode-edition");
            } else {
                L.DomUtil.removeClass(container, "mode-edition");
            }
            return draft.editing;
        },
        isEditMode: function () { return draft.editing; },

        appendDraftPoint: function (lat, lon) {
            draft.latlngs.push([lat, lon]);
            draft.line.setLatLngs(draft.latlngs);
            addVertex([lat, lon], draft.latlngs.length - 1);
            return draft.latlngs.length;
        },

        popDraftPoint: function () {
            if (!draft.latlngs.length) { return 0; }
            draft.latlngs.pop();
            draft.line.setLatLngs(draft.latlngs);
            var dernier = draft.markers.pop();
            if (dernier) { draft.vertices.removeLayer(dernier); }
            return draft.latlngs.length;
        },

        setDraft: function (points) {
            draft.latlngs = (points || []).map(function (p) { return [p[0], p[1]]; });
            draft.line.setLatLngs(draft.latlngs);
            redrawVertices();
            return draft.latlngs.length;
        },

        clearDraft: function () {
            draft.latlngs = [];
            draft.line.setLatLngs([]);
            draft.vertices.clearLayers();
            draft.markers = [];
            selectedIndex = -1;
            return 0;
        },

        insertPoint: function (index, lat, lon) {
            if (index < 0 || index > draft.latlngs.length) { return false; }
            draft.latlngs.splice(index, 0, [lat, lon]);
            draft.line.setLatLngs(draft.latlngs);
            // Les indices suivants se décalent : il faut tout redessiner.
            redrawVertices();
            return true;
        },

        movePoint: function (index, lat, lon) {
            if (index < 0 || index >= draft.latlngs.length) { return false; }
            draft.latlngs[index] = [lat, lon];
            draft.line.setLatLngs(draft.latlngs);
            // Un seul repère bouge : redessiner toute la trace coûterait cher
            // sur les tracés de plusieurs milliers de points.
            if (draft.markers[index]) {
                draft.markers[index].setLatLng([lat, lon]);
            }
            return true;
        },

        selectPoint: function (index, pan) {
            var ancien = selectedIndex;
            var anciens = Object.keys(selectedSet);
            selectedIndex = (index === null || index === undefined) ? -1 : index;
            selectedSet = {};
            // Seuls les repères concernés changent d'aspect : redessiner toute
            // la trace coûterait cher sur plusieurs milliers de points.
            anciens.forEach(function (i) {
                if (draft.markers[i]) { draft.markers[i].setStyle(vertexStyle(+i)); }
            });
            if (draft.markers[ancien]) {
                draft.markers[ancien].setStyle(vertexStyle(ancien));
            }
            if (draft.markers[selectedIndex]) {
                draft.markers[selectedIndex].setStyle(vertexStyle(selectedIndex));
                // Recentrer n'a de sens que si l'on désigne le point depuis une
                // autre vue ; poser un point là où l'on vient de cliquer, non.
                if (pan !== false) { map.panTo(draft.latlngs[selectedIndex]); }
            }
            return selectedIndex;
        },

        selectPoints: function (indexes) {
            var anciens = Object.keys(selectedSet).concat([selectedIndex]);
            selectedSet = {};
            (indexes || []).forEach(function (i) { selectedSet[i] = true; });
            selectedIndex = -1;
            anciens.concat(indexes || []).forEach(function (i) {
                if (draft.markers[i]) { draft.markers[i].setStyle(vertexStyle(+i)); }
            });
            return Object.keys(selectedSet).length;
        },

        selectedPoints: function () {
            return Object.keys(selectedSet).map(Number).sort(function (a, b) {
                return a - b;
            });
        },

        // Repères posés sur une trace consultée, pour une sélection multiple.
        focusPoints: function (coords) {
            geocairn.clearFocus();
            (coords || []).forEach(function (c) {
                focusGroup.addLayer(L.circleMarker([c[0], c[1]], {
                    radius: 6, color: "#b8860b", fillColor: "#ffd700",
                    fillOpacity: 1, weight: 2
                }));
            });
            if (coords && coords.length) { map.panTo([coords[0][0], coords[0][1]]); }
            return focusGroup.getLayers().length;
        },

        focusCount: function () { return focusGroup.getLayers().length; },

        // Repère indépendant du brouillon : sert à désigner un point d'une
        // trace simplement consultée.
        focusPoint: function (lat, lon) {
            geocairn.clearFocus();
            focusGroup.addLayer(L.circleMarker([lat, lon], {
                radius: 8, color: "#b8860b", fillColor: "#ffd700",
                fillOpacity: 1, weight: 3
            }));
            map.panTo([lat, lon]);
            return true;
        },

        clearFocus: function () {
            focusGroup.clearLayers();
            return true;
        },

        hasFocus: function () { return focusGroup.getLayers().length > 0; },

        selectedPoint: function () { return selectedIndex; },
        draftCount: function () { return draft.latlngs.length; },
        draftPoints: function () { return draft.latlngs; },

        // -- traces enregistrees affichees ----------------------------------
        showTrack: function (id, points, color, opacity, fit, name) {
            geocairn.hideTrack(id);
            var latlngs = (points || []).map(function (p) { return [p[0], p[1]]; });
            if (!latlngs.length) { return 0; }

            var alpha = (opacity === undefined || opacity === null) ? 0.9 : opacity;
            var line = L.polyline(latlngs, {
                color: color || "#1f5fbf", weight: 4, opacity: alpha
            }).addTo(map);
            if (name) { line.bindTooltip(name, { sticky: true }); }

            var ends = L.layerGroup().addTo(map);
            L.circleMarker(latlngs[0], endStyle("#1f8a3b", "#2ecc71", alpha))
                .addTo(ends).bindTooltip((name ? name + " — " : "") + "Départ");
            L.circleMarker(
                latlngs[latlngs.length - 1], endStyle("#8a1f1f", "#e74c3c", alpha)
            ).addTo(ends).bindTooltip((name ? name + " — " : "") + "Arrivée");

            var arrows = L.layerGroup().addTo(map);
            shownTracks[id] = {
                line: line, ends: ends, arrows: arrows,
                couleur: color || "#1f5fbf", opacity: alpha
            };
            drawArrows(shownTracks[id], color || "#1f5fbf", alpha);
            if (fit) { map.fitBounds(line.getBounds(), { padding: [40, 40] }); }
            return latlngs.length;
        },

        hideTrack: function (id) {
            var trace = shownTracks[id];
            if (!trace) { return false; }
            map.removeLayer(trace.line);
            map.removeLayer(trace.ends);
            map.removeLayer(trace.arrows);
            delete shownTracks[id];
            return true;
        },

        clearTracks: function () {
            Object.keys(shownTracks).forEach(function (id) {
                map.removeLayer(shownTracks[id].line);
                map.removeLayer(shownTracks[id].ends);
                map.removeLayer(shownTracks[id].arrows);
            });
            shownTracks = {};
            return 0;
        },

        setTrackStyle: function (id, color, opacity) {
            var trace = shownTracks[id];
            if (!trace) { return false; }
            var alpha = (opacity === undefined || opacity === null) ? 0.9 : opacity;
            trace.line.setStyle({ color: color, opacity: alpha });
            trace.ends.getLayers().forEach(function (marker) {
                marker.setStyle({ opacity: alpha, fillOpacity: alpha });
            });
            trace.couleur = color;
            trace.opacity = alpha;
            drawArrows(trace, color, alpha);
            return true;
        },

        arrowCount: function (id) {
            var trace = shownTracks[id];
            return trace ? trace.arrows.getLayers().length : 0;
        },

        arrowAngles: function (id) {
            var trace = shownTracks[id];
            if (!trace) { return []; }
            return trace.arrows.getLayers().map(function (m) {
                var html = m.options.icon.options.html;
                return parseFloat(html.replace(/^.*rotate\(/, ""));
            });
        },

        zoomTracks: function (ids) {
            var bounds = boundsOf(ids);
            if (!bounds.isValid()) { return false; }
            map.fitBounds(bounds, { padding: [40, 40] });
            return true;
        },

        shownTrackIds: function () {
            return Object.keys(shownTracks).map(Number);
        },

        isTrackShown: function (id) { return !!shownTracks[id]; },

        shownCount: function (id) {
            var trace = shownTracks[id];
            return trace ? trace.line.getLatLngs().length : 0;
        }
    };

    function connectBridge() {
        if (typeof QWebChannel === "undefined" || !window.qt || !qt.webChannelTransport) {
            setStatus("Carte prête (mode autonome)");
            return;
        }
        new QWebChannel(qt.webChannelTransport, function (channel) {
            bridge = channel.objects.bridge;
            setStatus("Carte prête");
            bridge.js_ready();
            reportView();
        });
    }

    window.addEventListener("load", connectBridge);
    </script>
</body>
</html>
